[project]
name = "dispec"
version = "0.1.0"
description = "DiSpec: a from-scratch disaggregated speculative-decoding LLM inference engine"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Reference baseline only; not a runtime dependency of the engine.
ref = ["vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["dispec*"]
