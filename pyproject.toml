[project]
name = "dispec"
version = "0.1.0"
description = "DiSpec: a from-scratch LLM inference engine — paged attention, continuous batching, CUDA graphs, speculative decoding, and prefill/decode disaggregation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",  # SDPA enable_gqa and lower-right CausalBias
    "transformers>=4.51",  # first release with Qwen3
    "accelerate>=0.33",
    "safetensors>=0.4",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# int4 GPTQ target support (Marlin kernels are JIT-compiled; needs ninja on PATH).
quant = ["gptqmodel>=7.1", "optimum>=2.2", "ninja", "torchvision"]
# Reference baseline only; not a runtime dependency of the engine.
ref = ["vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["dispec*"]
